         sodipodi:role="line"
         id="tspan1"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="109.29647">This is the ALERT template file</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="168.68272"
         id="tspan2">Open with Inkscape, read the description at the top of svgimport.zig, and get animating!</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="228.06897"
         id="tspan3">Good luck! Inkscape was not made for this.</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="287.45523"
         id="tspan4" /><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="346.84146"
         id="tspan5">Notes:</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="406.22772"
         id="tspan6">- DO NOT change the document size, ALERT expects coordinates in 1920x1080</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="465.61395"
         id="tspan33">   even if it supports any 16x9 resolution</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="525.00018"
         id="tspan7">- DO NOT add pages</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="584.38647"
         id="tspan8">- DO NOT expect anything other than straight line paths to work</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="643.77271"
         id="tspan9">- DO NOT expect fills to work</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="703.15894"
         id="tspan11">- DO NOT change the document units or scale factor</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="762.54523"
         id="tspan39">- DO NOT end a paths interpolation ID with R</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="821.93146"
         id="tspan41">- DO NOT change the number of nodes when using interpolation</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="65.922874"
         y="881.31769"
         id="tspan36">- DO look at some of the examples</tspan></text>
