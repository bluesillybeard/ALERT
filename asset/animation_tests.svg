         x="0"
         y="0"
         id="tspan27">- interpolation of line properties</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="0"
         y="0"
         id="tspan28">    - width</tspan><tspan
         sodipodi:role="line"
         style="fill:#000000;stroke:none;stroke-width:3.36677"
         x="0"
         y="0"
         id="tspan30">    - width percent isn't tested here but that code is exactly identical to everything else so</tspan><tspan
